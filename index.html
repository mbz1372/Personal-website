nd documentation.','Delivered a market-ready SaaS product.']],posts:[['product-operations-os','Why product managers should understand operations','A product is not just features; if operations cannot run it, it fails at scale.',['Product management in TravelTech means translating real market needs into systems teams can use every day.','The best products are built where product, operations, data and UX move together.']],['traveltech-supply-chain','TravelTech supply chain: where revenue begins','Rate and inventory accuracy directly affect trust and revenue.',['If rates, inventory, policies or API connectivity are inaccurate, even the best UX cannot create reliable bookings.']]]}};

function data(){try{return JSON.parse(localStorage.mbzData)||DATA}catch(e){return DATA}}function save(d){localStorage.mbzData=JSON.stringify(d,null,2)}function p(){let x=location.pathname.replace(/^\/+|\/+$/g,'').split('/').filter(Boolean);let lang=x[0]=='en'?'en':'fa';let sec=(x[0]=='fa'||x[0]=='en')?x[1]||'home':x[0]||'home';return{lang,sec,slug:x[2]}}function u(lang,sec='home',slug=''){return sec=='home'?`/${lang}`:`/${lang}/${sec}${slug?'/'+slug:''}`}function go(h){history.pushState({},'',h);render();scrollTo(0,0)}function esc(s){return String(s||'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}function tags(a){return `<div class='tags'>${(a||[]).map(t=>`<span class='tag'>${t}</span>`).join('')}</div>`}function head(k,t,d=''){return `<div class='head'><div><div class='ey'>${k}</div><h2>${t}</h2></div>${d?`<p>${d}</p>`:''}</div>`}function nav(d,lang,on){return `<div class='nav'><div class='wrap navin'><a class='brand' href='/${lang}' data-link><span class='logo'>MBZ</span><span>${d.name}<small>${d.role}</small></span></a><div class='links'>${d.paths.map((x,i)=>`<a data-link class='${on==x?'on':''}' href='${u(lang,x)}'>${d.nav[i]}</a>`).join('')}</div><div><button onclick='go("/admin")'>Admin</button><button onclick='go("${u(lang=='fa'?'en':'fa',on)}")'>${lang=='fa'?'EN':'FA'}</button></div></div></div>`}function hero(d){return `<section class='hero'><div class='wrap heroGrid'><div class='heroCard glass'><span class='badge'>● ${d.role}</span><h1>${d.headline}</h1><p class='lead'>${d.summary}</p><div class='cta'><a class='btn pri' data-link href='${u(d.lang,'portfolio')}'>${d.cta[0]}</a><a class='btn' data-link href='${u(d.lang,'resume')}'>${d.cta[1]}</a><a class='btn warn' data-link href='${u(d.lang,'contact')}'>${d.cta[2]}</a></div><div class='metrics'>${d.metrics.map(m=>`<div class='metric'><b>${m[0]}</b><span>${m[1]}</span></div>`).join('')}</div></div><aside class='profile glass'><div><div class='avatar'>MBZ</div><h2>${d.name}</h2><p class='muted'>${d.role}</p></div><div class='q'><div><span>Email</span><a href='mailto:${d.mail}'>${d.mail}</a></div><div><span>Phone</span><a href='tel:${d.phone}'>${d.phone}</a></div><div><span>Location</span><b>${d.loc}</b></div></div></aside></div></section>`}function services(d,l){return `<section class='sec'><div class='wrap'>${head(l.services,d.lang=='fa'?'چطور ارزش می‌سازم؟':'How I create value')}<div class='grid c3'>${d.services.map(s=>`<article class='card'><h3>${s[0]}</h3><p>${s[1]}</p></article>`).join('')}</div></div></section>`}function skills(d,l){return `<article class='card'><h3>${l.skills}</h3>${d.skills.map(s=>`<div class='skill'><b>${s[0]}</b><div class='bar'><i style='width:${s[1]}%'></i></div></div>`).join('')}</article>`}function timeline(d,l){return `<section class='sec'><div class='wrap split'><div>${head(l.career,d.lang=='fa'?'رزومه اجرایی و محصولی':'Product and operations resume')}${skills(d,l)}</div><div class='timeLine'>${d.exp.map(e=>`<article class='card'><span class='badge'>${e[0]}</span><h3>${e[1]}</h3><p><b>${e[2]}</b></p><ul>${e[3].map(i=>`<li>${i}</li>`).join('')}</ul></article>`).join('')}</div></div></section>`}function list(d,l,type,arr){let kind=type=='portfolio'?'projects':type;let title=type=='portfolio'?d.nav[3]:type=='case-studies'?d.nav[4]:d.nav[5];return `<section class='sec'><div class='wrap'>${head(title,title)}<input id='q' class='search' placeholder='${l.search}'><div class='grid c3' id='items'>${arr.map(x=>card(d,l,kind,x)).join('')}</div></div></section>`}function card(d,l,kind,x){let slug=x[0],title=x[1],sub=x[2],impact=x[3],tg=x[4]||[];return `<article class='card item' data-t='${esc(JSON.stringify(x).toLowerCase())}'><span class='badge'>${impact||''}</span><h3>${title}</h3><p>${sub}</p>${tags(tg)}<p><a class='btn' data-link href='${u(d.lang,kind,slug)}'>${l.open}</a></p></article>`}function featured(d,l){return `<section class='sec'><div class='wrap'>${head(l.projects,d.lang=='fa'?'نمونه‌کارهای اثرگذار':'Impactful work')}<div class='grid c3'>${d.projects.slice(0,3).map(x=>card(d,l,'projects',x)).join('')}</div></div></section>`}function cases(d,l){return `<section class='sec'><div class='wrap'>${head(l.cases,d.lang=='fa'?'روایت مسئله، راهکار و نتیجه':'Problem, solution and result')}<div class='grid c2'>${d.cases.map(x=>`<article class='card'><h3>${x[1]}</h3><p>${x[4]}</p><p><a class='btn' data-link href='${u(d.lang,'case-studies',x[0])}'>${l.open}</a></p></article>`).join('')}</div></div></section>`}function posts(d,l){return `<section class='sec'><div class='wrap'>${head(l.blog,d.lang=='fa'?'نگاه محصولی و عملیاتی':'Product and operations thinking')}<div class='grid c2'>${d.posts.map(x=>`<article class='card'><h3>${x[1]}</h3><p>${x[2]}</p><p><a class='btn' data-link href='${u(d.lang,'blog',x[0])}'>${l.open}</a></p></article>`).join('')}</div></div></section>`}function about(d,l){return `<section class='sec'><div class='wrap split'><article class='card'><span class='badge'>${d.role}</span><h2>${d.name}</h2><p>${d.summary}</p></article><article class='card'><h3>${d.edu[0]}</h3><p><b>${d.edu[1]}</b> — ${d.edu[2]}</p><p>${d.edu[3]}</p>${tags(d.certs)}</article></div></section>${services(d,l)}`}function resume(d,l){return timeline(d,l)+`<section class='sec'><div class='wrap grid c2'><article class='card'><h3>${d.edu[0]}</h3><p>${d.edu[3]}</p></article><article class='card'><h3>Certificates</h3><ul>${d.certs.map(c=>`<li>${c}</li>`).join('')}</ul></article></div></section>`}function detail(d,l,kind,slug){let arr=kind=='projects'?d.projects:kind=='case-studies'?d.cases:d.posts;let x=arr.find(i=>i[0]==slug)||arr[0];if(kind=='case-studies')return `<section class='sec'><div class='wrap'><article class='card glass'><a class='btn' data-link href='${u(d.lang,kind)}'>← ${l.back}</a><h1 class='detailTitle'>${x[1]}</h1></article><div class='grid c3'><article class='card'><h3>${l.problem}</h3><p>${x[2]}</p></article><article class='card'><h3>${l.solution}</h3><p>${x[3]}</p></article><article class='card'><h3>${l.result}</h3><p>${x[4]}</p></article></div></div></section>`;let body=kind=='projects'?x[5]:x[3];return `<section class='sec'><div class='wrap'><article class='card glass'><a class='btn' data-link href='${u(d.lang,kind=='projects'?'portfolio':'blog')}'>← ${l.back}</a><h1 class='detailTitle'>${x[1]}</h1><p class='lead'>${x[2]}</p>${tags(x[4])}</article><article class='card article'>${body.map(b=>`<p>${b}</p>`).join('')}</article></div></section>`}function contact(d){return `<section class='sec'><div class='wrap contact'><article class='card'><h2>${d.nav[6]}</h2><p class='muted'>${d.lang=='fa'?'برای همکاری، مشاوره محصول، طراحی سیستم عملیاتی یا گفتگو درباره TravelTech و SaaS پیام بده.':'For collaboration, product consulting, operational systems or TravelTech and SaaS conversations, reach out.'}</p><div class='q'><div><span>Email</span><a href='mailto:${d.mail}'>${d.mail}</a></div><div><span>Phone</span><a href='tel:${d.phone}'>${d.phone}</a></div><div><span>Website</span><b>${d.site}</b></div><div><span>Location</span><b>${d.loc}</b></div></div></article><form class='card form' onsubmit='mail(event)'><input id='name' placeholder='Name'><input id='subject' placeholder='Subject'><textarea id='msg' placeholder='Message'></textarea><button class='btn pri'>Email</button></form></div></section>`}function admin(lang){let l=L[lang],ok=localStorage.ok=='1';if(!ok)return `${nav(DATA[lang],lang,'admin')}<main class='admin'><div class='wrap'><form class='login glass' onsubmit='login(event)'><span class='badge'>Admin</span><h1>${l.admin}</h1><p class='notice'>${l.hint}</p><input class='search' id='pass' type='password' placeholder='${l.pass}'><button class='btn pri'>${l.login}</button></form></div></main>`;return `${nav(DATA[lang],lang,'admin')}<main class='admin'><div class='wrap adminGrid'><aside class='card'><span class='badge'>CMS Lite</span><h2>${l.admin}</h2><p class='notice'>${l.hint}</p><div class='cta'><button class='btn' onclick='localStorage.adminLang="fa";render()'>FA</button><button class='btn' onclick='localStorage.adminLang="en";render()'>EN</button><button class='btn' onclick='localStorage.ok="";render()'>Logout</button></div></aside><section class='card'><textarea id='json'>${esc(JSON.stringify(data(),null,2))}</textarea><div class='cta'><button class='btn pri' onclick='saveJson()'>${l.save}</button><button class='btn' onclick='copyJson()'>${l.copy}</button><button class='btn' onclick='downJson()'>${l.download}</button><button class='btn warn' onclick='localStorage.removeItem("mbzData");render()'>${l.reset}</button></div></section></div></main>`}function foot(d){return `<footer class='foot'><div class='wrap footin'><div>© ${new Date().getFullYear()} ${d.name}</div><div>${d.site} · ${d.mail}</div></div></footer>`}function render(){let r=p();let all=data();let lang=location.pathname=='/admin'?(localStorage.adminLang||'fa'):r.lang;let d=all[lang]||all.fa;d.lang=lang;let l=L[lang];document.documentElement.lang=lang;document.documentElement.dir=d.dir;document.body.className=lang=='en'?'en':'';if(location.pathname=='/admin'){app.innerHTML=admin(lang)+foot(d);bind();return}let sec=r.sec;let active=sec=='projects'?'portfolio':sec;let html=nav(d,lang,active);if(sec=='home')html+=hero(d)+services(d,l)+featured(d,l)+timeline(d,l)+cases(d,l)+posts(d,l)+contact(d);else if(sec=='about')html+=about(d,l);else if(sec=='resume')html+=resume(d,l);else if(sec=='portfolio')html+=list(d,l,'portfolio',d.projects);else if(sec=='case-studies'&&r.slug)html+=detail(d,l,'case-studies',r.slug);else if(sec=='case-studies')html+=list(d,l,'case-studies',d.cases);else if(sec=='blog'&&r.slug)html+=detail(d,l,'blog',r.slug);else if(sec=='blog')html+=list(d,l,'blog',d.posts);else if(sec=='projects')html+=detail(d,l,'projects',r.slug);else if(sec=='contact')html+=contact(d);else html+=hero(d);app.innerHTML=html+foot(d);bind()}function bind(){document.querySelectorAll('[data-link]').forEach(a=>a.onclick=e=>{e.preventDefault();go(a.getAttribute('href'))});let q=document.getElementById('q');if(q)q.oninput=()=>document.querySelectorAll('.item').forEach(x=>x.style.display=x.dataset.t.includes(q.value.toLowerCase())?'block':'none')}function login(e){e.preventDefault();if(pass.value==PASS){localStorage.ok='1';toast('Logged in');render()}else toast('Wrong password')}function saveJson(){try{save(JSON.parse(json.value));toast('Saved locally')}catch(e){toast(e.message)}}function copyJson(){navigator.clipboard.writeText(json.value);toast('Copied')}function downJson(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([json.value],{type:'application/json'}));a.download='mbz-site-content.json';a.click()}function mail(e){e.preventDefault();let d=data()[p().lang];location.href=`mailto:${d.mail}?subject=${encodeURIComponent(subject.value||'Website contact')}&body=${encodeURIComponent(name.value+'\n\n'+msg.value)}`}function toast(t){let x=document.createElement('div');x.className='toast';x.textContent=t;document.body.appendChild(x);setTimeout(()=>x.remove(),2200)}window.onpopstate=render;render();
</script>
